groups:
  - name: ContainerAlerts
    rules:
    - alert: ApplicationContainerDown
      expr: time() - container_last_seen{name="mrmteams-prod-eng-1"} > 40
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: Application container down (instance {{ $labels.instance }})
        description: "Application container has disappeared\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: ApplicationContainerDown
      expr: time() - container_last_seen{name="mrmteams-prod-eng-1"} > 60
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: Application container down (instance {{ $labels.instance }})
        description: "Application container has disappeared\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
